name: HappyHeadlines CI/CD

on:
  push:
    branches: [main]
    paths:
      - "HappyHeadlines/**"
      - ".github/workflows/happyheadlines.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ArticleService
          - CommentService
          - DraftService
          - ProfanityService
          - PublisherService
          - NewsletterService

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/rulz123/happyheadlines-$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./HappyHeadlines
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:1.0.${{ github.run_number }}
            ${{ env.IMAGE }}:latest